<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#16853a"><title>My Wallet 2.0</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f6f7;color:#17191b}button,input,select{font:inherit}button{border:0;background:none;cursor:pointer}.app{max-width:720px;margin:auto;min-height:100vh;background:#fff;padding-bottom:72px}.head{padding:18px 18px 8px;display:flex;align-items:center;justify-content:space-between}.title{font-size:28px;font-weight:750}.toprow{display:flex;align-items:center;gap:6px;margin:4px 0 18px}.toprow .seg{flex:1;margin:0}.seg{display:flex;justify-content:center}.seg button{padding:8px 12px;border:1px solid #ddd;flex:1}.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}.seg .on{background:#eee;font-weight:700}.plus{width:42px;height:42px;border-radius:10px;background:#16853a;color:#fff;font-size:25px;line-height:1}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(720px,100%);display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid #ddd;background:#fff;z-index:20;padding-bottom:env(safe-area-inset-bottom)}.nav button{padding:10px 3px 9px;font-size:11px;color:#687078}.nav button.on{color:#16853a;font-weight:700}.nav button span{display:block;font-size:19px;line-height:18px;margin-bottom:3px}.content{padding:16px}.available{background:#f3f7f4;border-radius:14px;padding:15px 16px;margin-bottom:16px}.available small{color:#687078}.available strong{display:block;font-size:25px;margin-top:3px}.period{display:flex;align-items:center;justify-content:center;gap:18px;margin:8px 0 18px}.period button{font-size:22px;padding:2px 8px}.period strong{min-width:150px;text-align:center}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}.stat{padding:13px;border:1px solid #e2e4e6;border-radius:12px}.stat small{color:#687078;display:block;margin-top:4px}.stat b{display:block;font-size:18px}.expense{margin:14px 0;cursor:pointer}.row{display:flex;align-items:center;gap:10px;margin:11px 0}.bar{height:10px;background:#e5e8e9;border-radius:99px;flex:1;overflow:hidden}.bar i{display:block;height:100%;background:#16853a;border-radius:99px}.amount{min-width:85px;text-align:right;font-weight:650}.list{border-top:1px solid #eee}.day{font-size:13px;color:#687078;margin:16px 0 8px}.op{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}.income{color:#16853a}.out{color:#c84b34}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.toolbar button{color:#16853a;font-weight:700}.search{width:100%;padding:11px 13px;border:1px solid #ddd;border-radius:10px;margin-bottom:10px}.card{border:1px solid #e0e2e4;border-radius:14px;padding:15px;margin:10px 0}.card h3{margin:0 0 6px}.muted{color:#687078}.cat{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #eee}.danger{color:#c84b34}.field{display:block;margin:10px 0}.field span{display:block;font-size:12px;color:#687078;margin-bottom:4px}.field input,.field select{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px}.empty{padding:35px 10px;text-align:center;color:#687078}@media(min-width:721px){body{padding:18px}.nav{border-left:1px solid #ddd;border-right:1px solid #ddd}.app{border:1px solid #ddd;border-radius:16px;overflow:hidden;box-shadow:0 8px 30px #00000012}}
</style></head><body><div class="app"><div id="app"></div></div><script>
const cats=['Casa','Auto','Spese domestiche','Comunicazione','Divertimenti','Altre spese'];const sub={Casa:['Affitto','Bollette','Manutenzione'],Auto:['Carburante','Assicurazione','Manutenzione'],'Spese domestiche':['Alimentari','Pulizia','Casa'],Comunicazione:['Telefono','Internet'],Divertimenti:['Ristoranti','Viaggi','Tempo libero'],'Altre spese':['Salute','Abbigliamento','Varie']};const income=['Azioni/Titoli','Cashback','Reso soldi anticipati','Affitto','Stipendio'];let ops=JSON.parse(localStorage.getItem('mw_ops')||'null')||[{d:'2026-09-11',t:'out',x:'Spesa di test',a:42,c:'Altre spese',s:'Varie'},{d:'2026-09-10',t:'in',x:'Entrata di test',a:3000,c:'Stipendio',s:''},{d:'2026-09-09',t:'out',x:'Spesa casa',a:850,c:'Casa',s:'Affitto'}];let tab='summary',period='Mese',year=2026,month=8,filter=null,editing=false,showAvail=true;const eur=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n);function save(){localStorage.setItem('mw_ops',JSON.stringify(ops))}function totals(){let i=ops.filter(o=>o.t==='in').reduce((s,o)=>s+o.a,0),e=ops.filter(o=>o.t==='out').reduce((s,o)=>s+o.a,0);return[i,e,i-e]}function nav(){return `<div class="nav">${[['summary','▥','Sommario'],['ops','☷','Operazioni'],['rec','↻','Ricorrente'],['cats','◫','Categorie'],['settings','⚙','Impostazioni']].map(x=>`<button class="${tab===x[0]?'on':''}" onclick="tab='${x[0]}';filter=null;render()"><span>${x[1]}</span>${x[2]}</button>`).join('')}</div>`}function header(title,back=false){return `<div class="head">${back?'<button onclick="goSummary()">‹</button>':'<span></span>'}<div class="title">${title}</div><button class="plus" onclick="add()">＋</button></div>`}
function summary(){let[inc,exp,bal]=totals(),map={};ops.filter(o=>o.t==='out').forEach(o=>map[o.c]=(map[o.c]||0)+o.a);let max=Math.max(...Object.values(map),1);return `<div class="content"><div class="toprow"><div class="seg">${['Settimana','Mese','Anno'].map(x=>`<button class="${period===x?'on':''}" onclick="period='${x}';render()">${x}</button>`).join('')}</div><button class="plus" aria-label="Aggiungi spesa" onclick="add()">＋</button></div><div class="available"><small>Disponibile　<button onclick="showAvail=!showAvail;render()">${showAvail?'◉':'○'}</button></small><strong>${showAvail?eur(12830.39):'••••••'}</strong></div><div class="period"><button onclick="prevMonth()">‹</button><strong>${new Date(year,month).toLocaleString('it-IT',{month:'long',year:'numeric'})}</strong><button onclick="nextMonth()">›</button></div><div class="stats"><div class="stat"><b class="out">${eur(exp)}</b><small>Spese</small></div><div class="stat"><b class="income">${eur(inc)}</b><small>Entrate</small></div><div class="stat"><b>${eur(bal)}</b><small>Saldo</small></div></div>${Object.entries(map).map(([c,a])=>`<div class="expense" onclick="filter='${c}';tab='ops';render()"><div class="row"><b>${c}</b><span class="amount">${eur(a)}</span></div><div class="bar"><i style="width:${a/max*100}%"></i></div></div>`).join('')}</div>${nav()}`}function prevMonth(){month--;if(month<0){month=11;year--}render()}function nextMonth(){month++;if(month>11){month=0;year++}render()}
function operations(){let list=filter?ops.filter(o=>o.c===filter):ops;list=[...list].sort((a,b)=>b.d.localeCompare(a.d));return `${header('Operazioni',!!filter)}<div class="content">${filter?`<div class="muted" style="margin-bottom:10px"><button onclick="goOps()">‹ Indietro</button> · Categoria: <b>${filter}</b></div>`:''}<input class="search" placeholder="Cerca operazioni…" oninput="this.dataset.q=this.value;document.querySelectorAll('.op').forEach(e=>e.style.display=e.innerText.toLowerCase().includes(this.value.toLowerCase())?'flex':'none')"><div class="toolbar"><span>${list.length} operazioni</span><button onclick="editing=!editing;render()">${editing?'Fine':'Modifica'}</button></div><div class="list">${list.map(o=>`<div class="op" onclick="${editing?'':'openInfo('+ops.indexOf(o)+')'}"><div><b>${o.x}</b><div class="muted">${o.c}${o.s?' · '+o.s:''}</div></div><div class="${o.t==='in'?'income':'out'}">${o.t==='in'?'+':'−'} ${eur(o.a)} ${editing?`<button class="danger" onclick="event.stopPropagation();del(${ops.indexOf(o)})">🗑</button>`:''}</div></div>`).join('')}</div></div>${nav()}`}function goOps(){filter=null;tab='ops';render()}
function recurring(){return `${header('Ricorrente')}<div class="content"><div class="toolbar"><b>Spese ricorrenti</b><button onclick="add()">＋</button></div><div class="card"><h3>Affitto</h3><div class="muted">Mensile · €850</div></div><div class="card"><h3>Internet</h3><div class="muted">Mensile · €35</div></div><h3 style="margin-top:25px">Entrate ricorrenti</h3><div class="card"><h3>Stipendio</h3><div class="muted">Mensile · €3.000</div></div><button class="action" onclick="alert('Sezione Ricorrenze inattive pronta per la gestione.')">Ricorrenze inattive</button></div>${nav()}`}function categories(){return `${header('Categorie')}<div class="content"><div class="toolbar"><b>ENTRATE</b><button onclick="addCat(true)">＋</button></div>${income.map(x=>`<div class="cat"><span>${x}</span><span class="muted">›</span></div>`).join('')}<div class="toolbar" style="margin-top:25px"><b>SPESE</b><button onclick="addCat(false)">＋</button></div>${cats.map(c=>`<div class="cat" onclick="alert('${sub[c].join(' · ')}')"><span>${c}</span><span class="muted">›</span></div>`).join('')}</div>${nav()}`}function settings(){return `${header('Impostazioni')}<div class="content"><div class="card"><h3>Conti e saldi</h3><div class="muted">Gestione dei conti e del saldo disponibile</div></div><div class="card"><h3>Privacy e visualizzazione</h3><div class="muted">Nascondi importi e preferenze di visualizzazione</div></div><div class="card"><h3>Backup / Esportazione</h3><button onclick="exportData()">Esporta dati JSON</button></div><div class="card"><h3>Informazioni</h3><div class="muted">My Wallet 2.0 · versione di test</div></div></div>${nav()}`}function info(i){let o=ops[i];return `${header('Info',true)}<div class="content"><div class="card"><label class="field"><span>Descrizione</span><input id="x" value="${o.x}"></label><label class="field"><span>Importo</span><input id="a" type="number" step="0.01" value="${o.a}"></label><label class="field"><span>Tipo</span><select id="t"><option value="out" ${o.t==='out'?'selected':''}>Spesa</option><option value="in" ${o.t==='in'?'selected':''}>Entrata</option></select></label><label class="field"><span>Categoria</span><select id="c">${[...cats,...income].map(c=>`<option ${c===o.c?'selected':''}>${c}</option>`).join('')}</select></label><label class="field"><span>Data</span><input id="d" type="date" value="${o.d}"></label><button class="action" onclick="updateOp(${i})">Salva modifiche</button><button style="color:#c84b34;width:100%;padding:12px" onclick="del(${i})">Elimina operazione</button></div></div>${nav()}`}function add(){editing=false;document.getElementById('app').innerHTML=header('Nuova operazione',true)+`<div class="content"><div class="card"><label class="field"><span>Descrizione</span><input id="x" placeholder="Es. Spesa supermercato"></label><label class="field"><span>Importo</span><input id="a" type="number" step="0.01" placeholder="0,00"></label><label class="field"><span>Tipo</span><select id="t"><option value="out">Spesa</option><option value="in">Entrata</option></select></label><label class="field"><span>Categoria</span><select id="c">${[...cats,...income].map(c=>`<option>${c}</option>`).join('')}</select></label><label class="field"><span>Data</span><input id="d" type="date" value="${new Date().toISOString().slice(0,10)}"></label><button class="action" onclick="createOp()">Salva operazione</button></div></div>${nav()}`}function createOp(){ops.push({x:x.value,a:+a.value||0,t:t.value,c:c.value,s:'',d:d.value});save();tab='ops';render()}function updateOp(i){ops[i]={...ops[i],x:x.value,a:+a.value||0,t:t.value,c:c.value,d:d.value};save();tab='ops';render()}function openInfo(i){document.getElementById('app').innerHTML=info(i)}function del(i){if(confirm('Eliminare questa operazione?')){ops.splice(i,1);save();tab='ops';render()}}function addCat(){let n=prompt('Nome nuova categoria');if(n)alert('Categoria creata: '+n+' (test)')}function exportData(){let b=new Blob([JSON.stringify(ops,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mywallet-backup.json';a.click()}function goSummary(){tab='summary';filter=null;render()}function render(){document.getElementById('app').innerHTML=tab==='summary'?summary():tab==='ops'?operations():tab==='rec'?recurring():tab==='cats'?categories():settings()}render();
</script></body></html>
